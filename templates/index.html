<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Driver Monitoring System</h1>
        <div class="video-container">
            <img id="videoStream" src="{{ url_for('video_feed') }}" alt="Video Feed">
        </div>
        <div class="buttons">
            <button class="start-btn" onclick="startDetection()">Start Detection</button>
            <button class="stop-btn" onclick="stopDetection()">Stop Detection</button>
            <button class="start-aisle" onclick="startAisleDetection()">Start Aisle Detection</button>
            <button class="stop-aisle" onclick="stopAisleDetection()">Stop Aisle Detection</button>
        </div>
    </div>
    
    <script>
        function startDetection() {
            fetch('/start_driver_monitoring', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status));
        }

        function stopDetection() {
            fetch('/stop_driver_monitoring', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status));
        }
        
        function startAisleDetection() {
            fetch('/start_aisle_detection', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status));
        }

        function stopAisleDetection() {
            fetch('/stop_aisle_detection', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status));
        }
    </script>
</body>
</html>
