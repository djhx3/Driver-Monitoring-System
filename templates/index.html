<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
        .video-container {
            width: 80%;
            max-width: 640px;
            border: 2px solid #ccc;
            background-color: #000;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .stop-btn {
            background-color: #DC3545;
        }
        .stop-btn:hover {
            background-color: #A71D2A;
        }
    </style>
</head>
<body>

    <h1>Driver Monitoring System</h1>
    <div class="container">
        <div class="video-container">
            <img id="videoStream" src="/video_feed" alt="Video Feed">
        </div>
        <div class="buttons">
            <button onclick="startDriverMonitoring()">Start Driver Monitoring</button>
            <button class="stop-btn" onclick="stopDriverMonitoring()">Stop Driver Monitoring</button>
            <button onclick="startAisleDetection()">Start Aisle Detection</button>
            <button class="stop-btn" onclick="stopAisleDetection()">Stop Aisle Detection</button>
        </div>
    </div>

    <script>
        function startDriverMonitoring() {
            fetch('/start_driver_monitoring', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status))
                .catch(error => alert('Error: ' + error));
        }

        function stopDriverMonitoring() {
            fetch('/stop_driver_monitoring', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status))
                .catch(error => alert('Error: ' + error));
        }

        function startAisleDetection() {
            fetch('/start_aisle_detection', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status))
                .catch(error => alert('Error: ' + error));
        }

        function stopAisleDetection() {
            fetch('/stop_aisle_detection', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.status))
                .catch(error => alert('Error: ' + error));
        }
    </script>

</body>
</html>
